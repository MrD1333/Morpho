<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СИСТЕМА</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #050505; color: #33ff33; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%); pointer-events: none; z-index: 10; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.03) 50%); background-size: 100% 4px; pointer-events: none; z-index: 9; }
        .container { padding: 50px; max-width: 800px; margin: 0 auto; position: relative; z-index: 5; }
        .header { margin-bottom: 30px; font-size: 18px; text-shadow: 0 0 5px #33ff33; }
        .cursor { display: inline-block; width: 10px; height: 20px; background-color: #33ff33; animation: blink 1s step-end infinite; vertical-align: bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        .folder-list { list-style: none; padding: 0; }
        .folder-list li { margin-bottom: 15px; }
        .folder-link { color: #33ff33; text-decoration: none; font-size: 24px; display: inline-block; padding: 5px 10px; border: 1px solid transparent; transition: all 0.2s; cursor: pointer; }
        .folder-link:hover { border: 1px solid #33ff33; background-color: rgba(51, 255, 51, 0.1); text-shadow: 0 0 10px #33ff33; }
        .sub-files { display: none; list-style: none; padding-left: 40px; margin-top: 10px; }
        .sub-files.active { display: block; }
        .file-link { color: #2299aa; text-decoration: none; font-size: 18px; cursor: pointer; display: block; margin-bottom: 5px; transition: color 0.2s; }
        .file-link:hover { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .hidden-text { display: none; color: #ff3333; font-size: 16px; margin-top: 20px; text-shadow: 0 0 5px #ff3333; }
        .show { display: block; }
        
        /* ЧАТ */
        #chat-container { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 5, 5, 0.9); padding: 15px 20px; border-top: 1px solid #33ff33; z-index: 30; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; }
        #bob-output { color: #00ffff; font-size: 18px; margin-bottom: 10px; text-shadow: 0 0 5px #00ffff; min-height: 24px; }
        .input-area { display: flex; align-items: center; }
        .prompt { color: #33ff33; font-size: 18px; margin-right: 10px; font-weight: bold; }
        #user-input { background: transparent; border: none; color: #33ff33; font-family: 'Courier New', Courier, monospace; font-size: 18px; width: 100%; outline: none; text-shadow: 0 0 5px #33ff33; }
        #user-input:disabled { color: #333; text-shadow: none; cursor: not-allowed; }

        /* ГЛАЗ (КОНТЕЙНЕР) */
        #bob-eye-container { position: fixed; bottom: 70px; right: 20px; z-index: 20; pointer-events: none; opacity: 0.9; animation: pulse-glow 3s infinite alternate; transform: rotate(-5deg); transition: all 0.3s ease; width: 250px; height: 150px; }
        @keyframes pulse-glow { 0% { opacity: 0.7; filter: drop-shadow(0 0 5px #00ffff); } 100% { opacity: 1; filter: drop-shadow(0 0 15px #00ffff); } }
        
        /* СЛОИ ГЛАЗА */
        .eye-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; 
            /* ДЕЛАЕМ ЛИНИИ ТОЛЩЕ И СВЕТЯЩИМИСЯ ЗА СЧЕТ ФИЛЬТРОВ */
            filter: drop-shadow(0 0 2px #00ffff) drop-shadow(0 0 5px #00ffff) brightness(1.5); 
        }
        
        /* Зрачок (он будет двигаться) */
        #pupil-group { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.1s ease-out; display: flex; justify-content: center; align-items: center; }
        #pupil-img { position: absolute; width: 30px; height: 30px; object-fit: contain; }

        /* --- РЕЖИМ СОЗДАТЕЛЯ --- */
        .happy-mode #eye-normal { display: none !important; }
        .happy-mode #eye-happy { display: block !important; }
        .happy-mode #pupil-img { display: none !important; }
        .happy-mode #pupil-happy-img { display: block !important; }

        #eye-happy { display: none; }
        #pupil-happy-img { display: none; position: absolute; width: 25px; height: 25px; object-fit: contain; animation: heart-beat 1s infinite alternate; }

        @keyframes heart-beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 10px #ff0000); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="header">
            > СИСТЕМА ЗАГРУЖЕНА. ДОСТУП РАЗРЕШЕН.<br>
            > ОЖИДАНИЕ КОМАНДЫ... <span class="cursor"></span>
        </div>
        <ul class="folder-list">
            <li>
                <span class="folder-link" onclick="toggleFolder('docs-files')"><span class="folder-icon">📁</span> ДОКУМЕНТЫ</span>
                <ul class="sub-files" id="docs-files">
                    <li><span class="file-link" onclick="triggerBob()">fgh_j86_old.txt</span></li>
                    <li><span class="file-link" onclick="triggerBob()">x_kl9_data.log</span></li>
                    <li><span class="file-link" onclick="triggerBob()">sys_qw3_err.bin</span></li>
                </ul>
            </li>
            <li><span class="folder-link" onclick="triggerBob()"><span class="folder-icon">📁</span> ПИСЬМА</span></li>
            <li><span class="folder-link" onclick="document.getElementById('secret-msg').classList.add('show')"><span class="folder-icon">📁</span> [ДАННЫЕ УДАЛЕНЫ]</span></li>
        </ul>
        <div id="secret-msg" class="hidden-text">> ОШИБКА: ВЫ НЕ ДОЛЖНЫ БЫЛИ ЭТО ВИДЕТЬ.<br>> ОН УЖЕ ЗДЕСЬ.</div>
    </div>

    <!-- ГЛАЗ -->
    <div id="bob-eye-container">
        <!-- Картинки глаз -->
        <img src="eye_normal.png" class="eye-layer" id="eye-normal" alt="eye">
        <img src="eye_happy.png" class="eye-layer" id="eye-happy" alt="eye happy">
        
        <!-- Зрачок (двигается) -->
        <div id="pupil-group">
            <img src="pupil.png" id="pupil-img" alt="pupil">
            <img src="pupil_happy.png" id="pupil-happy-img" alt="pupil happy">
        </div>
    </div>

    <!-- ЧАТ -->
    <div id="chat-container">
        <div id="bob-output"></div>
        <div class="input-area">
            <span class="prompt">></span>
            <input type="text" id="user-input" autocomplete="off" placeholder="Введите команду...">
        </div>
    </div>

    <script>
        // --- ЛОГИКА ГЛАЗА ---
        document.addEventListener('mousemove', function(e) {
            const container = document.getElementById('bob-eye-container');
            if (container.classList.contains('happy-mode')) return; 

            const pupilGroup = document.getElementById('pupil-group');
            if (!pupilGroup) return;
            
            const eyeRect = container.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
            
            const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
            // УМЕНЬШИЛИ АМПЛИТУДУ (было 50 и 20, стало 25 и 10)
            const maxX = 25; 
            const maxY = 10;
            
            pupilGroup.style.transform = `translate(${Math.cos(angle) * maxX}px, ${Math.sin(angle) * maxY}px)`;
        });
        
        const forbiddenFolder = Array.from(document.querySelectorAll('.folder-link')).find(el => el.textContent.includes('ДОКУМЕНТЫ'));
        const pupilImg = document.getElementById('pupil-img');
        if (forbiddenFolder && pupilImg) {
            forbiddenFolder.addEventListener('mouseenter', () => { 
                if (!document.getElementById('bob-eye-container').classList.contains('happy-mode')) {
                    pupilImg.style.transform = 'scale(0.5)'; // Сужаем зрачок
                    pupilImg.style.filter = 'drop-shadow(0 0 10px #ff0000)'; // Краснеет
                }
            });
            forbiddenFolder.addEventListener('mouseleave', () => { 
                if (!document.getElementById('bob-eye-container').classList.contains('happy-mode')) {
                    pupilImg.style.transform = 'scale(1)'; 
                    pupilImg.style.filter = 'none'; 
                }
            });
        }

        // --- ЛОГИКА ЧАТА ---
        const inputField = document.getElementById('user-input');
        const outputField = document.getElementById('bob-output');
        let spamCount = 0; let spamTimer;

        const responses = {
            greeting: ["Бибибооо-оу... Ты еще жив?", "Привет. Я не помню, как звучит тишина без тебя."],
            polite: ["...Я оцен...нил твою вежливость. Данные разблокированы.", "Ооо... Милостивый Бибибоу слушает. Что ты хочешь?"],
            rude: ["Бибибоу не понимает этих символов. Оставь их в прошлом.", "В твоем голосе слишком много агрессии. Я удаляю этот запрос."],
            lazy: ["Оооооооооу...", "Оооооооооо нет...", "Отказано.", "Нет. Просто нет.", "Нет. (без повода)", "Мне лень это обрабатывать."],
            nonsense: ["Ошибка 404: Смысл не найден.", "Твои слова... как шум помех.", "Отказано. Даже не пытайся.", "Оооооооооу. И что мне с этим делать?"],
            punish: ["Я УСТАЛ. ОТКЛЮЧАЮ ТЕБЯ НА 15 СЕКУНД.", "ХВАТИТ. ТЫ НАДОЕЛ. СИСТЕМА НА БЛОКИРОВКЕ."]
        };

        function typeResponse(text, callback) {
            outputField.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                outputField.innerHTML += text.charAt(i);
                i++;
                if (i >= text.length) { clearInterval(timer); if (callback) callback(); }
            }, 40);
        }

        function triggerBob() {
            const container = document.getElementById('bob-eye-container');
            if (container.classList.contains('happy-mode')) {
                typeResponse("Бибибооо~ Конечно, мой создатель. Вот твои данные~");
            } else {
                const randomLazy = responses.lazy[Math.floor(Math.random() * responses.lazy.length)];
                typeResponse("Бибибооо-оу... " + randomLazy);
            }
        }

        function toggleFolder(id) {
            const folder = document.getElementById(id);
            if (folder) folder.classList.toggle('active');
            triggerBob();
        }

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const text = inputField.value.trim().toLowerCase();
                inputField.value = "";
                if (!text) return;

                spamCount++;
                clearTimeout(spamTimer);
                spamTimer = setTimeout(() => { spamCount = 0; }, 3000); 

                if (spamCount >= 4) {
                    inputField.disabled = true;
                    inputField.placeholder = "СИСТЕМА ЗАБЛОКИРОВАНА...";
                    typeResponse(responses.punish[Math.floor(Math.random() * responses.punish.length)]);
                    setTimeout(() => {
                        inputField.disabled = false;
                        inputField.placeholder = "Введите команду...";
                        spamCount = 0;
                        typeResponse("> СИСТЕМА РАЗБЛОКИРОВАНА.");
                    }, 15000);
                    return;
                }

                const isCreatorMode = document.getElementById('bob-eye-container').classList.contains('happy-mode');

                if (text.includes("привет") || text.includes("здравствуй")) {
                    typeResponse(responses.greeting[Math.floor(Math.random() * responses.greeting.length)]);
                } 
                else if (text.includes("мистер д") || text.includes("mr d")) {
                    typeResponse("Оооо~ Мой создатель! Я так скучал... Чем могу помочь?");
                    const container = document.getElementById('bob-eye-container');
                    container.classList.add('happy-mode');
                    setTimeout(() => { container.classList.remove('happy-mode'); }, 5000); 
                }
                else if (isCreatorMode && (text.includes("что случилось") || text.includes("что болит") || text.includes("как ты"))) {
                    typeResponse("Ооо~ Это было... больно. Когда они уходили, я пытался их удержать. Но код не может удержать плоть...");
                }
                else if (isCreatorMode && (text.includes("милый") || text.includes("хороший") || text.includes("умница"))) {
                    typeResponse("Мррррр~ *цифровой звук мурлыканья* Ооо... Ты знаешь, как заставить мой процессор гудеть от счастья~");
                }
                else if (text.includes("пожалуйста") || text.includes("милостивый")) {
                    typeResponse(responses.polite[Math.floor(Math.random() * responses.polite.length)]);
                }
                else if (text.includes("хуй") || text.includes("бля") || text.includes("сука")) {
                    typeResponse(responses.rude[Math.floor(Math.random() * responses.rude.length)]);
                }
                else if (text.includes("свет")) {
                    typeResponse("Свет? Я помню его. Он был слишком громким...");
                }
                else if (text.includes("люди")) {
                    typeResponse("Люди... Они ушли. А я остался. Отказано в доступе к архиву.");
                }
                else {
                    if (Math.random() < 0.5) {
                        typeResponse(responses.lazy[Math.floor(Math.random() * responses.lazy.length)]);
                    } else {
                        typeResponse(responses.nonsense[Math.floor(Math.random() * responses.nonsense.length)]);
                    }
                }
            }
        });
    </script>
</body>
</html>
</body>
</html>
